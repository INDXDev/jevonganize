name: Release
on:
  push: { tags: ['v*'] }
permissions:
  contents: read
# Actions are pinned by SHA. Renovate (config:best-practices) keeps the SHAs current.
# No dependency cache here: a poisoned cache must not reach a job that can publish.
# The channels are npm and one draft GitHub Release, nothing else. See docs/releasing.md.
jobs:
  # Fails early unless the tag is v<package.json version> and CHANGELOG.md has that section. Then it
  # creates the draft, so the desktop jobs add to one release instead of racing to create three.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Creates the draft GitHub Release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version }
      - run: node scripts/release.ts notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME exists. Leaving its notes alone." >&2
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: write # Uploads to the draft GitHub Release.
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # The same package as npm gets, attached to the draft for people who want to check it.
  tarball:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Uploads to the draft GitHub Release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm pack --dry-run --json | node scripts/release.ts pack-check
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/pack/*.tgz --clobber
  # Runs last, over every file on the draft.
  checksums:
    needs: [desktop, tarball]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Uploads to the draft GitHub Release.
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          gh release download "$GITHUB_REF_NAME"
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
  npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Trusted publishing: no token is stored.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: npm pack --dry-run --json | node scripts/release.ts pack-check
      - run: npm install -g npm@12.2.2
      # This only stages the version. It goes public when a person approves it with 2FA, so a stolen
      # workflow can stage a release but not ship one.
      - run: npm stage publish --provenance --access public
