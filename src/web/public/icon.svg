<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Jevonganize</title>
  <defs>
    <linearGradient id="surface" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#262a33"/>
      <stop offset="0.5" stop-color="#14161b"/>
      <stop offset="1" stop-color="#090a0c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="front" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#d6e4ff"/>
      <stop offset="0.42" stop-color="#7aa7ff"/>
      <stop offset="1" stop-color="#3a66e6"/>
    </linearGradient>
    <linearGradient id="back" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#8f7bff"/>
      <stop offset="1" stop-color="#3b2fa8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6f8fff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#6f8fff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6f8fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#04060f" flood-opacity="0.65"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <!-- One tag, drawn upright around the origin. Pointed top, soft shoulders, wide body. -->
    <path id="body" d="M0 -372 L200 -222 Q232 -198 232 -158 V262 Q232 342 152 342 H-152 Q-232 342 -232 262 V-158 Q-232 -198 -200 -222 Z"/>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#surface)"/>
  <g clip-path="url(#tile)">
    <circle cx="512" cy="540" r="460" fill="url(#glow)"/>
    <use href="#body" fill="url(#back)" opacity="0.9" transform="translate(566 526) rotate(17) scale(0.9)"/>
    <g transform="translate(486 532) rotate(-9) scale(0.9)" filter="url(#lift)">
      <path fill="url(#front)" fill-rule="evenodd" d="
        M0 -372 L200 -222 Q232 -198 232 -158 V262 Q232 342 152 342 H-152 Q-232 342 -232 262 V-158 Q-232 -198 -200 -222 Z
        M0 -240 a56 56 0 1 0 0.01 0 Z
        M-120 -46 a38 38 0 0 0 0 76 H120 a38 38 0 0 0 0 -76 Z
        M-120 72 a38 38 0 0 0 0 76 H52 a38 38 0 0 0 0 -76 Z
        M-120 190 a38 38 0 0 0 0 76 H-30 a38 38 0 0 0 0 -76 Z"/>
    </g>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="url(#rim)" stroke-width="4"/>
</svg>
